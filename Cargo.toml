[package]
name = "desktop"
version = "0.2.0"
edition = "2024"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
emmu-core = { path = "../../crates/emmu-core" }
emmu-nes = { path = "../../crates/emmu-nes" }
emmu-frontend = { path = "../../crates/emmu-frontend" }
emmu-mesen-sys = { path = "../../crates/emmu-mesen-sys" }
png = "0.17"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
